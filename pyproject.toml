[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foncier-mcp"
version = "0.1.0"
description = "MCP server for French public land data: addresses, cadastral parcels, DVF sales, zoning, energy diagnostics and risks, with a source and a date on every field."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Guillaume Couillard" }]
keywords = ["mcp", "model-context-protocol", "cadastre", "dvf", "urbanisme", "open-data", "france"]
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.27",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
foncier-mcp = "foncier_mcp.cli:main"

[project.urls]
Repository = "https://github.com/1000vario/foncier-mcp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["foncier_mcp", "helpers"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
