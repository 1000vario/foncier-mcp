name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests evals
      - run: ruff format --check src tests evals
      - run: pytest -q
      - name: Offline evals on recorded responses
        run: python evals/run.py --offline

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t foncier-mcp .
      - name: Container answers on /health
        run: |
          docker run -d --name fm -p 8080:8080 foncier-mcp
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/health && break; sleep 1; done
          curl -fsS http://localhost:8080/health | grep '"status":"ok"'

  powershell-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deployment scripts parse without error
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Path deploy -Recurse -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) { Write-Host "$($f.Name) line $($e.Extent.StartLineNumber): $($e.Message)"; $bad++ }
            Write-Host "$($f.Name): $($errors.Count) parse error(s)"
          }
          if ($bad -gt 0) { exit 1 }
