name: Live evals

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Run the eval suite against the live public APIs
        run: python evals/run.py --live --out evals/results/live-ci
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/live-ci
